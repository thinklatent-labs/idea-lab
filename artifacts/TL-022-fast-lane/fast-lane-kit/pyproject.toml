[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastlane"
version = "0.1.0"
description = "Fast-lane proof kit: serving speed, bucket promises and a picker for Gemma 4 31B on vLLM (ThinkLatent Idea Lab, TL-022)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "ThinkLatent" }]
dependencies = [
    "aiohttp>=3.9",   # Apache-2.0
    "pyyaml>=6",      # MIT
    "numpy>=1.26",    # BSD-3-Clause
]

[project.optional-dependencies]
data = ["datasets>=3.0", "huggingface_hub>=0.25"]   # Apache-2.0; transformers comes with vLLM
test = ["pytest>=8"]

[project.scripts]
fastlane = "fastlane.cli:main"

[tool.setuptools.packages.find]
include = ["fastlane*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
