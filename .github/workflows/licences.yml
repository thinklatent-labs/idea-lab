name: licences
# Dependencies may only use MIT, Apache-2.0, BSD, ISC, Unlicense or CC0.
# Report-only until the open exceptions are decided; delete LICENSE_CHECK_REPORT_ONLY to enforce.
# Runs only when dependencies change, so the nightly sync does not trigger it.
on:
  push:
    branches: [main]
    paths: ['dashboard/package-lock.json', 'dashboard/package.json', 'licenses.exceptions.json', 'scripts/check-licenses.mjs']
  pull_request:
    paths: ['dashboard/package-lock.json', 'dashboard/package.json', 'licenses.exceptions.json', 'scripts/check-licenses.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: cd dashboard && npm ci --legacy-peer-deps --ignore-scripts
      - name: Licence allowlist
        shell: bash
        env:
          LICENSE_CHECK_REPORT_ONLY: '1'
        run: node scripts/check-licenses.mjs dashboard | tee -a "$GITHUB_STEP_SUMMARY"
